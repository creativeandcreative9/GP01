<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>モールス練習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>モールス練習</h1>
    <div class="stats">正解 <b id="score">0 / 0</b> 連続 <b id="streak">0</b>
      <button id="reset" class="link">リセット</button></div>
  </header>

  <section class="stage">
    <div id="flash" class="flash"><span id="sym"></span></div>
    <div id="pattern" class="pattern" aria-live="off"></div>
    <div id="hint" class="hint"></div>
    <div id="result" class="result" role="status"></div>
  </section>

  <button id="start" class="primary">スタート</button>
  <div class="actions">
    <button id="play" class="secondary">もう一度聞く</button>
    <button id="next" class="primary" hidden>次へ</button>
  </div>

  <section id="keys" class="keys" aria-label="回答"></section>

  <details>
    <summary>設定</summary>
    <label>速度 <span id="wpmLabel"></span><input id="wpm" type="range" min="5" max="30"></label>
    <label>音の高さ <span id="freqLabel"></span><input id="freq" type="range" min="400" max="900" step="50"></label>
    <label>練習する文字数 <span id="levelLabel"></span><input id="level" type="range" min="2" max="36"></label>
    <label class="row"><input id="visual" type="checkbox"> 視覚表示(光・ト/ツー)</label>
  </details>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
