<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>モールス練習 Morse Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>モールス練習<span class="en">Morse Practice</span></h1>
    <div class="stats">正解 <b id="score">0 / 0</b> 連続 <b id="streak">0</b>
      <button id="reset" class="link">リセット</button></div>
  </header>

  <nav class="modes">
    <button id="modeListen" class="seg on">聞き取り<span class="en">Listen</span></button>
    <button id="modeKey" class="seg">打鍵<span class="en">Keying</span></button>
    <button id="modeFree" class="seg">フリー打鍵<span class="en">Free</span></button>
    <button id="modeMuse" class="seg">聞き取り上級<span class="en">Advanced</span></button>
  </nav>

  <section class="board">
    <div class="hud">
      <span><span id="targetLabel">TARGET</span> <b id="target">?</b></span>
      <span id="trace" class="trace"></span>
      <span><span id="attemptLabel">ATTEMPT</span> <b id="attempt">01</b></span>
    </div>
    <div class="lamps">
      <div><span id="lampOk" class="lamp"></span>OK</div>
      <div><span id="lampNg" class="lamp"></span>NG</div>
    </div>
    <svg id="tree" viewBox="0 0 384 292" role="img" aria-label="モールス符号ツリー Morse code tree">
      <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter></defs>
    </svg>
    <div class="legend"><i class="lg-dot"></i>SHORT 短 · ト dit <i class="lg-dash"></i>LONG 長 · ツー dah</div>
    <div id="tape" class="tape" hidden></div>
    <div id="sym" class="sym"></div>
    <div id="hint" class="hint"></div>
    <div id="result" class="result" role="status"></div>
  </section>

  <button id="start" class="primary">スタート<span class="en">Start</span></button>
  <div class="actions">
    <button id="prev" class="secondary" hidden>◀ 前<span class="en">Prev</span></button>
    <button id="play" class="secondary">もう一度聞く<span class="en">Listen again</span></button>
    <button id="pause" class="secondary" hidden>一時停止<span class="en">Pause</span></button>
    <button id="next" class="primary" hidden>次へ<span class="en">Next</span></button>
  </div>

  <section id="keys" class="keys" aria-label="回答 Answer"></section>

  <section id="keyPad" class="keypad" hidden>
    <button id="key" class="keybtn" aria-label="打鍵 Tap key">打鍵 TAP<span class="en">短く=ト dit / 長押し=ツー dah</span></button>
    <button id="keyClear" class="secondary">入力を消す Clear</button>
    <div id="freeBtns" class="freebtns" hidden>
      <button id="fSpace" class="secondary">スペース<span class="en">Space</span></button>
      <button id="fBack" class="secondary">1文字消す<span class="en">Back</span></button>
      <button id="fClear" class="secondary">全消去<span class="en">Clear all</span></button>
    </div>
  </section>

  <ol id="museLog" class="muselog" start="1" hidden></ol>

  <details>
    <summary>設定 Settings</summary>
    <label>速度 Speed <span id="wpmLabel"></span><input id="wpm" type="range" min="5" max="30"></label>
    <label>音の高さ Pitch <span id="freqLabel"></span><input id="freq" type="range" min="400" max="900" step="50"></label>
    <label>練習ステップ Step <select id="step"></select></label>
    <label>練習する文字数 Letters to practice <span id="levelLabel"></span><input id="level" type="range" min="2" max="26"></label>
    <label class="row"><input id="visual" type="checkbox"> 視覚表示 Visual cues(光・ト/ツー glow, dit/dah)</label>
  </details>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
